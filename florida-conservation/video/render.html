<!doctype html>
<html><head><meta charset="utf-8"><title>Florida Lands Conserved – video renderer</title>
<style>
@font-face{font-family:"Barlow Semi Condensed";font-weight:600;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:700;src:url(fonts/barlow-700.woff2) format("woff2")}
@font-face{font-family:"Public Sans";font-weight:400;src:url(fonts/public-400.woff2) format("woff2")}
@font-face{font-family:"Public Sans";font-weight:600;src:url(fonts/public-600.woff2) format("woff2")}
html,body{margin:0;background:#0d1211}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script>
/* Frame-by-frame renderer for the social video. Call window.setup(format) then window.renderFrame(i). */
const C = {
  bg:'#0d1211', land:'#1b2421', county:'#28332f', coast:'#33403b', water:'#0d1211',
  public:'#2e9a66', private:'#b5801c', nonprofit:'#5a86d0', tribal:'#c4618a', dev:'#d9d6e0', hi:'#ffffff',
  ink:'#eef2ee', ink2:'#b4bfb8', muted:'#7f8b84', rule:'#26302d'
};
const FD = '"Barlow Semi Condensed", "Arial Narrow", sans-serif', FB = '"Public Sans", system-ui, sans-serif';
const FPS = 30, MINY = 1900, MAXY = 2026, LAND = 34.6e6;
const OWN = ['public','private','nonprofit','tribal'], OWN_NAMES = ['Public','Private','Nonprofit','Tribal'];
const ANN = [[1908,'Ocala National Forest'],[1947,'Everglades National Park'],[1972,'Environmentally Endangered Lands program'],
             [1981,'Save Our Rivers'],[1990,'Preservation 2000'],[2001,'Florida Forever']];
// timeline: seconds -> year
const KEYS = [[0,MINY],[0.8,MINY],[8.8,1960],[25.8,MAXY]];
const HOLD = 5.0, TOTAL = KEYS[KEYS.length-1][0] + HOLD;
function yearAt(t){
  for (let i=1;i<KEYS.length;i++){ const [t0,y0]=KEYS[i-1],[t1,y1]=KEYS[i];
    if (t <= t1) return y0 + (y1-y0)*((t-t0)/(t1-t0)); }
  return MAXY;
}
let devMeta, DEV, devCanvas, devCtx, devImg, devDrawn = -1;
const devAcres = y => devMeta.yearly[Math.min(Math.max(Math.floor(y),1900),2021)] || 0;
let cv, ctx, W, H, L, groups, statePath, countyPath, lakePath, bounds, cum, meta, featByYear;
async function load(){
  const [topo, m, dm, db] = await Promise.all([fetch('../lands.json').then(r=>r.json()), fetch('../meta.json').then(r=>r.json()),
    fetch('../developed_meta.json').then(r=>r.json()), fetch('../developed.bin').then(r=>r.arrayBuffer())]);
  devMeta = dm; const b = new Uint8Array(db), n = dm.n;
  DEV = {idx:new Uint32Array(n), F:new Uint8Array(n), Q:new Uint8Array(n*4), n};
  let p = 0, cur = 0;
  for (let i=0;i<n;i++){ let v=0, sh=0, byte; do { byte=b[p++]; v |= (byte&0x7f)<<sh; sh+=7; } while(byte&0x80);
    cur += v; DEV.idx[i]=cur; DEV.F[i]=b[p++]; for (let k=0;k<4;k++) DEV.Q[i*4+k]=b[p++]; }
  devCanvas = document.createElement('canvas'); devCanvas.width = dm.nx; devCanvas.height = dm.ny;
  devCtx = devCanvas.getContext('2d'); devImg = devCtx.createImageData(dm.nx, dm.ny);
  meta = m;
  const ring = (geom, p, bb) => {
    const polys = geom.type==='Polygon' ? [geom.coordinates] : geom.type==='MultiPolygon' ? geom.coordinates : [];
    for (const poly of polys) for (const r of poly){ r.forEach(([x,y],i)=>{ i?p.lineTo(x,y):p.moveTo(x,y);
      if(bb){ if(x<bb[0])bb[0]=x; if(y<bb[1])bb[1]=y; if(x>bb[2])bb[2]=x; if(y>bb[3])bb[3]=y; } }); p.closePath(); }
  };
  statePath = new Path2D(); bounds=[Infinity,Infinity,-Infinity,-Infinity];
  topojson.feature(topo, topo.objects.state).features.forEach(f=>ring(f.geometry, statePath, bounds));
  lakePath = new Path2D(); topojson.feature(topo, topo.objects.lakes).features.forEach(f=>ring(f.geometry, lakePath));
  countyPath = new Path2D();
  const mesh = topojson.mesh(topo, topo.objects.counties, (a,b)=>a!==b);
  (mesh.type==='LineString'?[mesh.coordinates]:mesh.coordinates).forEach(l=>l.forEach(([x,y],i)=>i?countyPath.lineTo(x,y):countyPath.moveTo(x,y)));
  const g = new Map();
  featByYear = new Map();
  for (const f of topojson.feature(topo, topo.objects.lands).features){
    const p = f.properties; if (p.y === 0) continue;
    const grp = OWN[p.o];
    const k = p.y+'|'+grp+'|'+p.e;
    if (!g.has(k)) g.set(k, {y:p.y, g:grp, e:p.e, path:new Path2D()});
    ring(f.geometry, g.get(k).path);
    if (!featByYear.has(p.y)) featByYear.set(p.y, new Map());
    const fy = featByYear.get(p.y); fy.set(p.n, (fy.get(p.n)||0) + p.a);
  }
  groups = [...g.values()].sort((a,b)=>a.y-b.y);
  cum = []; const acc={public:0,private:0,nonprofit:0,tribal:0};
  for (let y=1845;y<=MAXY;y++){ const s=meta.stats[y]||{};
    for (const k of OWN) acc[k] += (s[k]||0)+(s[k+'_m']||0);
    if (y >= MINY) cum.push({...acc}); }
}
function layout(fmt){
  if (fmt === 'vertical'){ W=1080; H=1920;
    return { map:[40,330,1000,1240], title:[64,120], stats:[64,1010], year:[64,980], chart:[64,1610,952,190], src:[64,1868], ann:[64,375] };
  }
  W=1080; H=1080;
  return { map:[300,80,760,880], title:[56,92], stats:[56,520], year:[56,490], chart:[56,940,968,92], src:[56,1056], ann:[56,180] };
}
let LAY, FMT, hatch;
window.setup = async function(fmt){
  FMT = fmt; if (!groups) await load(); await document.fonts.ready;
  await Promise.all(['600 20px "Barlow Semi Condensed"','700 20px "Barlow Semi Condensed"','400 20px "Public Sans"','600 20px "Public Sans"'].map(f=>document.fonts.load(f)));
  LAY = layout(fmt); cv = document.getElementById('c'); cv.width=W; cv.height=H; ctx = cv.getContext('2d');
  hatch = {};
  for (const g of OWN){ const hc = document.createElement('canvas'); hc.width=hc.height=9; const h=hc.getContext('2d');
    h.strokeStyle=C[g]; h.lineWidth=3; h.beginPath(); for(let i=-9;i<=18;i+=9){h.moveTo(i,9);h.lineTo(i+9,0);} h.stroke();
    hatch[g] = ctx.createPattern(hc,'repeat'); }
  const hk = document.createElement('canvas'); hk.width=hk.height=9; const h2=hk.getContext('2d');
  h2.strokeStyle=C.ink2; h2.lineWidth=2; h2.beginPath(); for(let i=-9;i<=18;i+=9){h2.moveTo(i,9);h2.lineTo(i+9,0);} h2.stroke();
  hatch.key = ctx.createPattern(hk,'repeat');
  return Math.ceil(TOTAL*FPS);
};
const fmtAc = v => v>=1e6 ? (v/1e6).toFixed(2)+' million' : v>=1e3 ? Math.round(v/1e3).toLocaleString()+',000' : Math.round(v).toLocaleString();
const ease = t => t<0?0:t>1?1:t*t*(3-2*t);
function text(s, x, y, font, color, align='left', base='alphabetic'){ ctx.font=font; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline=base; ctx.fillText(s,x,y); }

window.renderFrame = function(i){
  const t = i/FPS, yf = yearAt(t), yr = Math.floor(yf), endT = t - KEYS[KEYS.length-1][0];
  const holdFade = endT > 0 ? Math.max(0, 1 - endT/1.2) : 1;
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  // ---- map ----
  const [mx,my,mw,mh] = LAY.map, bw=bounds[2]-bounds[0], bh=bounds[3]-bounds[1];
  const k = Math.min(mw/bw, mh/bh), ox = mx + (mw-bw*k)/2 - bounds[0]*k, oy = my + (mh-bh*k)/2 + bounds[3]*k;
  ctx.setTransform(k,0,0,-k,ox,oy); const px = 1/k;
  ctx.fillStyle=C.land; ctx.fill(statePath); ctx.fillStyle=C.water; ctx.fill(lakePath);
  { const yo = Math.min(yr, 2021) - 1900;
    if (yo !== devDrawn){ const c = d3.rgb(C.dev), d = devImg.data;
      for (let i=0;i<DEV.n;i++){ const q=i*4, kq=(DEV.Q[q]<=yo)+(DEV.Q[q+1]<=yo)+(DEV.Q[q+2]<=yo)+(DEV.Q[q+3]<=yo), o=DEV.idx[i]*4;
        d[o]=c.r; d[o+1]=c.g; d[o+2]=c.b; d[o+3]= kq ? Math.min(255, 30 + DEV.F[i]*kq/4*0.8) : 0; }
      devCtx.putImageData(devImg,0,0); devDrawn = yo; }
    ctx.save(); ctx.translate(devMeta.x0, devMeta.y0); ctx.scale(devMeta.res, -devMeta.res);
    ctx.imageSmoothingEnabled = true; ctx.drawImage(devCanvas, 0, 0); ctx.restore(); }
  ctx.lineWidth=px*1; ctx.strokeStyle=C.county; ctx.stroke(countyPath);
  for (const g of groups){
    if (g.y > yr) break;
    const age = yf - g.y; // years since acquired (>=0)
    if (g.e){ ctx.globalAlpha=.35; ctx.fillStyle=C[g.g]; ctx.fill(g.path); ctx.globalAlpha=1;
      const hp = hatch[g.g]; hp.setTransform(new DOMMatrix([px,0,0,-px,0,0])); ctx.fillStyle=hp; ctx.fill(g.path);
    } else { ctx.fillStyle=C[g.g]; ctx.fill(g.path); }
    if (age < 2.2 && holdFade > 0){ // flash new acquisitions
      const a = (1 - age/2.2) * holdFade;
      ctx.globalAlpha = a*.45; ctx.fillStyle=C.hi; ctx.fill(g.path);
      ctx.globalAlpha = a; ctx.lineWidth=px*2.4; ctx.strokeStyle=C.hi; ctx.stroke(g.path); ctx.globalAlpha=1;
    }
  }
  ctx.lineWidth=px*0.8; ctx.strokeStyle=C.coast; ctx.stroke(statePath);
  ctx.setTransform(1,0,0,1,0,0);

  const row = cum[yr-MINY], tot = OWN.reduce((s,k)=>s+row[k],0), V = FMT==='vertical';
  // ---- title ----
  const [tx,ty] = LAY.title;
  text('FLORIDA · 1900 TO TODAY', tx, ty-50, `600 ${V?30:22}px ${FD}`, C.muted);
  text(V?'Florida’s conserved':'Florida’s conserved and developed', tx, ty+(V?10:0), `700 ${V?76:46}px ${FD}`, C.ink);
  text(V?'and developed land,':'land, year by year', tx, ty+(V?92:52), `700 ${V?76:46}px ${FD}`, C.ink);
  if (V) text('year by year', tx, ty+174, `700 76px ${FD}`, C.ink);

  // ---- big year + counters (sit in the empty Gulf) ----
  const [sx,sy] = LAY.stats;
  text(String(yr), sx, sy, `700 ${V?200:150}px ${FD}`, C.ink);
  const sw = V?30:22, gap = V?74:52;
  OWN.forEach((g,j)=>{
    const y0 = sy + (V?58:44) + j*gap;
    ctx.fillStyle=C[g]; ctx.fillRect(sx,y0,sw,sw);
    text(OWN_NAMES[g==='public'?0:g==='private'?1:g==='nonprofit'?2:3], sx+sw+(V?16:12), y0+sw*.38, `400 ${V?24:18}px ${FB}`, C.ink2, 'left','middle');
    text(fmtAc(row[g])+' acres', sx+sw+(V?16:12), y0+sw*1.45, `600 ${V?36:27}px ${FD}`, C.ink, 'left','middle');
  });
  { const y0 = sy + (V?58:44) + 4*gap + (V?10:6);
    ctx.fillStyle=C.dev; ctx.fillRect(sx,y0,sw,sw);
    text(yr > 2021 ? 'Developed (through 2021)' : 'Developed', sx+sw+(V?16:12), y0+sw*.38, `400 ${V?24:18}px ${FB}`, C.ink2, 'left','middle');
    text(fmtAc(devAcres(yf))+' acres', sx+sw+(V?16:12), y0+sw*1.45, `600 ${V?36:27}px ${FD}`, C.ink, 'left','middle'); }
  { const y0 = sy + (V?58:44) + 5*gap + (V?16:10);
    const hp = hatch.key; hp.setTransform(new DOMMatrix()); ctx.fillStyle=hp; ctx.fillRect(sx,y0,sw,sw);
    ctx.strokeStyle=C.ink2; ctx.lineWidth=1.5; ctx.strokeRect(sx+.75,y0+.75,sw-1.5,sw-1.5);
    text('Hatched: conservation easement', sx+sw+(V?16:12), y0+sw/2, `400 ${V?24:18}px ${FB}`, C.ink2, 'left','middle'); }

  // ---- program callouts ----
  const [ax,ay] = LAY.ann;
  for (const [y,l] of ANN){
    const d = yf - y; if (d < 0 || d > (y<1960?14:5)) continue;
    const span = y<1960?14:5, a = Math.min(1, d/0.6) * Math.min(1, (span-d)/1.2);
    ctx.globalAlpha = Math.max(0,a);
    ctx.fillStyle = C.hi; ctx.fillRect(ax, ay-(V?30:22), 6, V?40:30);
    text(`${y} · ${l}`, ax+20, ay, `600 ${V?34:24}px ${FD}`, C.ink);
    ctx.globalAlpha = 1;
  }

  // ---- cumulative strip chart ----
  const [cx,cy,cw,ch] = LAY.chart, ymax = 11e6;
  const X = y => cx + (y-MINY)/(MAXY-MINY)*cw, Y = v => cy+ch - v/ymax*ch;
  ctx.strokeStyle=C.rule; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(cx,cy+ch+.5); ctx.lineTo(cx+cw,cy+ch+.5); ctx.stroke();
  const layers = OWN.map((g,j)=>[g, r=>OWN.slice(0,j+1).reduce((s,k)=>s+r[k],0)]);
  for (let L=layers.length-1; L>=0; L--){
    const [g,fn] = layers[L];
    ctx.beginPath(); ctx.moveTo(X(MINY), Y(0));
    for (let y=MINY; y<=yr; y++){ ctx.lineTo(X(y), Y(fn(cum[y-MINY]))); ctx.lineTo(X(y+1>yr?yf:y+1), Y(fn(cum[y-MINY]))); }
    ctx.lineTo(X(yf), Y(0)); ctx.closePath(); ctx.fillStyle = C[g]; ctx.fill();
  }
  ctx.beginPath(); for (let y=MINY; y<=Math.floor(yf); y++){ const px=X(y), py=Y(devAcres(y)); y===MINY?ctx.moveTo(px,py):ctx.lineTo(px,py); }
  ctx.lineTo(X(yf), Y(devAcres(yf))); ctx.strokeStyle=C.dev; ctx.lineWidth=V?4:3; ctx.stroke();
  ctx.globalAlpha=holdFade; ctx.fillStyle=C.hi; ctx.fillRect(X(yf)-1.5, cy-4, 3, ch+4); ctx.globalAlpha=1;
  const tickY = cy+ch+(V?32:0);
  if (V) [1900,1950,2000].forEach(y=>text(String(y), X(y), tickY, `400 22px ${FB}`, C.muted, 'center'));
  text(`${(tot/1e6).toFixed(1)}M acres conserved · ${(devAcres(yf)/1e6).toFixed(1)}M developed`, cx, cy-(V?14:10), `600 ${V?28:20}px ${FD}`, C.ink2);
  // arrow marking 2000 (appears once the line reaches it)
  if (yf >= 2000){
    const r2k = cum[2000-MINY], top = Y(OWN.reduce((s,k)=>s+r2k[k],0)), x2 = X(2000), s2 = V?1:0.8;
    ctx.globalAlpha = Math.min(1, (yf-2000)/1.5);
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(x2, top-6*s2); ctx.lineTo(x2-9*s2, top-20*s2); ctx.lineTo(x2+9*s2, top-20*s2); ctx.closePath(); ctx.fill();
    text('2000', x2, top-28*s2, `600 ${V?26:18}px ${FD}`, C.ink, 'center');
    ctx.globalAlpha = 1;
  }

  // ---- source ----
  const [srx,sry] = LAY.src;
  text('Data: FNAI · FL DEP state lands · Florida Forever · USGS PAD-US · USGS NLCD · HISDAC-US', srx, sry, `400 ${V?22:16}px ${FB}`, C.muted);
};
</script></body></html>
